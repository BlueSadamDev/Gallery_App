name: Build APK Android

# Déclenchement uniquement manuel : cliquer sur "Run workflow" dans l'onglet Actions.
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances du projet
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le runner ubuntu-latest contient déjà un SDK Android complet,
      # donc aucune action d'installation supplémentaire n'est nécessaire.

      - name: Générer le projet natif Android
        run: npx expo prebuild --platform android --no-install

      - name: Restaurer la clé de signature
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/gallery-release.keystore

      - name: Configurer la signature de l'APK
        run: |
          echo "GALLERY_STORE_FILE=gallery-release.keystore" >> android/gradle.properties
          echo "GALLERY_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> android/gradle.properties
          echo "GALLERY_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> android/gradle.properties
          echo "GALLERY_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> android/gradle.properties
          python3 .github/patch_build_gradle.py

      - name: Compiler l'APK release
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Déposer l'APK (artefact téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: gallery-apk
          path: android/app/build/outputs/apk/release/*.apk