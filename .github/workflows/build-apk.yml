name: Build APK Android

# Déclenchement uniquement manuel : cliquer sur "Run workflow" dans l'onglet Actions.
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      # Supprime les warnings npm pour que expo-modules-autolinking
      # puisse parser la sortie JSON de npm list --json
      npm_config_warn: "false"

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances du projet
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Vérifier que les 4 secrets de signature sont présents
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "ERREUR : secret ANDROID_KEYSTORE_BASE64 manquant – ajoute-le dans Settings > Secrets and variables"; exit 1; fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then echo "ERREUR : secret ANDROID_KEYSTORE_PASSWORD manquant – ajoute-le dans Settings > Secrets and variables"; exit 1; fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then echo "ERREUR : secret ANDROID_KEY_PASSWORD manquant – ajoute-le dans Settings > Secrets and variables"; exit 1; fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then echo "ERREUR : secret ANDROID_KEY_ALIAS manquant – ajoute-le dans Settings > Secrets and variables"; exit 1; fi
          echo "Les 4 secrets de signature sont présents"

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Le runner ubuntu-latest contient déjà un SDK Android complet,
      # donc aucune action d'installation supplémentaire n'est nécessaire.

      - name: Injecter le versionCode dans app.json
        run: |
          BASE_VERSION=1
          VERSION_CODE=$((BASE_VERSION + GITHUB_RUN_NUMBER))
          jq ".expo.android.versionCode = $VERSION_CODE" app.json > app.json.tmp && mv app.json.tmp app.json
          echo "versionCode injecté : $VERSION_CODE"

      - name: Générer le projet natif Android
        run: npx expo prebuild --platform android --no-install

      - name: Restaurer la clé de signature
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/gallery-release.keystore

      - name: Configurer la signature de l'APK
        run: |
          python3 .github/patch_build_gradle.py

      - name: Compiler l'APK release
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon \
            -PGALLERY_STORE_FILE=gallery-release.keystore \
            -PGALLERY_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PGALLERY_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PGALLERY_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Déposer l'APK (artefact téléchargeable)
        uses: actions/upload-artifact@v7
        with:
          name: gallery-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Nettoyer le keystore décodé
        if: always()
        run: rm -f android/app/gallery-release.keystore