# Veille des nouveaux modèles Gemini, chaque dimanche.
# Signale les modèles inconnus de l'app dans la fiche GitHub « Veille des modèles Gemini ».
# Besoin : le secret GEMINI_API_KEY (Settings > Secrets and variables > Actions).
# Lancement manuel possible depuis l'onglet Actions (« Run workflow »).

name: Veille des modèles Gemini

on:
  schedule:
    - cron: '17 7 * * 0' # dimanche, 7 h 17 UTC (8 h 17 à Paris en hiver)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Comparer les modèles de Google avec ceux de l'app
        run: node scripts/veille-modeles.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
